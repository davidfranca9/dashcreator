<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento não concluído · The Creators Club</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --navy:#0A2463; --cream:#EAE4D4; --paper:#F5F1E8; --terra:#C9956A; --danger:#c04d57; }
body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--navy); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
.card { max-width: 540px; width: 100%; background: #fff; border-radius: 12px; padding: 3rem 2.5rem; text-align: center; border: 0.5px solid rgba(10,36,99,0.12); }
.dot { width: 60px; height: 60px; border-radius: 50%; background: var(--danger); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 1.5rem; }
h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 500; margin-bottom: 0.6rem; line-height: 1.1; }
p { color: rgba(10,36,99,0.65); font-size: 0.95rem; line-height: 1.7; margin-bottom: 1.4rem; }
.btn { display: inline-block; background: var(--navy); color: var(--cream); padding: 0.85rem 1.6rem; border-radius: 6px; text-decoration: none; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="card">
    <div class="dot">!</div>
    <h1>Não conseguimos concluir o pagamento</h1>
    <p>O Mercado Pago recusou ou cancelou a transação. Tente outro cartão ou outro método de pagamento.</p>
    <a class="btn" href="{% url 'checkout_page' product_key='dashcreator' %}">Tentar novamente</a>
</div>
</body>
</html>
