{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#102642" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1523" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Creators">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{% block title %}The Creators Club{% endblock %}</title>
    <link rel="icon" type="image/png" sizes="64x64" href="{% static 'studio/creators-club-favicon.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'studio/pwa-icon-180.png' %}">
    <link rel="manifest" href="{% static 'studio/manifest.webmanifest' %}">
    <link rel="stylesheet" href="{% static 'studio/app.css' %}">
</head>
<body class="auth-body">
    <div class="auth-card{% block auth_card_class %}{% endblock %}">
        <div class="auth-copy">
            <img class="brand-logo brand-logo--auth" src="{% static 'studio/creators-club-logo-banner.png' %}" alt="The Creators Club">
            <p>{% block auth_copy %}{% endblock %}</p>
        </div>
        <div class="auth-form">
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div class="message">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
            {% block auth_content %}{% endblock %}
        </div>
    </div>
</body>
</html>
