<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a2463">
  <title>{% block titulo %}Central TCC{% endblock %} · The Creators Club</title>
  <link rel="icon" type="image/png" href="/assets/logo-tcc.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* marca */
      --navy: #0a2463; --navy-2: #16306e; --navy-3: #071a47;
      --azul: #2f6fed; --azul-claro: #6b9dff;
      --ouro: #c7b58b;
      --papel: #f5f1e8; --papel-2: #ece6d8; --superficie: #ffffff; --superficie-2: #fbf9f4;
      /* texto (contraste AA sobre branco e sobre o papel) */
      --tinta: #151b2e; --tinta-2: #3f4556; --mudo: #62687a;
      --linha: rgba(10, 36, 99, .09); --linha-2: rgba(10, 36, 99, .18);
      /* situação: cor sempre junto de ícone ou texto */
      --ok: #1b7a52; --ok-fundo: #e3f3eb;
      --espera: #8a5800; --espera-fundo: #fcf0d7;
      --erro: #b02e3a; --erro-fundo: #fbe7e8;
      --info: #2456b8; --info-fundo: #e8eefc;
      --confirmar: #5a4596; --confirmar-fundo: #efebf8;
      --display: "Playfair Display", Georgia, "Times New Roman", serif;
      --ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --raio: 14px; --raio-p: 10px;
      --sombra-1: 0 1px 2px rgba(10, 36, 99, .05);
      --sombra-2: 0 10px 30px rgba(10, 36, 99, .09);
      --z-barra: 30; --z-lateral: 40;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-padding-top: 90px; }
    body { margin: 0; background: var(--papel); color: var(--tinta); font-family: var(--ui); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; border-radius: 6px; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  </style>
  {% block estilos %}{% endblock %}
</head>
