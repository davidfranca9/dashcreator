<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a2463">
  <title>{% block titulo %}Central TCC{% endblock %} · The Creators Club</title>
  <link rel="icon" type="image/png" href="/assets/logo-tcc.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0a2463; --navy-2: #16306e; --navy-3: #081d49;
      --paper: #f5f1e8; --paper-2: #eae4d4; --card: #fffaf0; --white: #ffffff;
      --gold: #c7b58b; --blue: #3c86fe; --green: #258f64; --red: #b13540; --amber: #b7791f;
      --ink: #1a1410; --ink-2: #5a5345; --muted: #8c8475;
      --line: rgba(10, 36, 99, .12); --line-2: rgba(10, 36, 99, .24);
      --display: "Playfair Display", Georgia, "Times New Roman", serif;
      --ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --sombra: 0 18px 50px rgba(10, 36, 99, .08);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    button, input { font: inherit; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  </style>
  {% block estilos %}{% endblock %}
</head>
<body class="{% block corpo_classe %}{% endblock %}">
  {% block corpo %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
