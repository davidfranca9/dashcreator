{% extends "studio/base.html" %}

{% block content %}
<section class="card">
    <div class="card-header">
        <div>
            <h3>{{ form_title }}</h3>
            <p>Registre e acompanhe oportunidades antes do fechamento.</p>
        </div>
    </div>

    <form method="post" class="form-grid prospect-form">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-field{% if field.name == 'note' or field.name == 'new_niche' %} form-field--full{% endif %}{% if field.name == 'meeting_date' %} meeting-date-field{% endif %}"{% if field.name == 'meeting_date' and not form.meeting_scheduled.value %} hidden{% endif %}>
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                    <small class="field-help">{{ field.help_text }}</small>
                {% endif %}
                {{ field.errors }}
            </div>
        {% endfor %}

        <div class="form-actions form-field--full">
            <button type="submit" class="primary-button">Salvar lead</button>
            <a class="ghost-button" href="{% url cancel_url %}">Cancelar</a>
        </div>
    </form>
</section>
<script>
    (() => {
        const form = document.querySelector(".prospect-form");
        const proposalField = document.getElementById("id_proposal_value");
        if (!form || !proposalField) {
            return;
        }

        const parseNumber = (value) => {
            const normalizedValue = String(value || "").replace(",", ".").trim();
            const parsed = Number.parseFloat(normalizedValue);
            return Number.isFinite(parsed) ? parsed : 0;
        };

        const normalizeMoneyField = () => {
            if (!proposalField.value.trim()) {
                return;
            }
            proposalField.value = parseNumber(proposalField.value).toFixed(2);
        };

        proposalField.addEventListener("blur", normalizeMoneyField);
        form.addEventListener("submit", normalizeMoneyField);

        const meetingScheduledField = document.getElementById("id_meeting_scheduled");
        const meetingDateFieldWrapper = form.querySelector(".meeting-date-field");
        const meetingDateField = document.getElementById("id_meeting_date");

        const syncMeetingDateVisibility = () => {
            if (!meetingScheduledField || !meetingDateFieldWrapper) {
                return;
            }
            const isVisible = meetingScheduledField.checked;
            meetingDateFieldWrapper.hidden = !isVisible;
            if (!isVisible && meetingDateField) {
                meetingDateField.value = "";
            }
        };

        if (meetingScheduledField && meetingDateFieldWrapper) {
            syncMeetingDateVisibility();
            meetingScheduledField.addEventListener("change", syncMeetingDateVisibility);
        }
    })();
</script>
{% endblock %}
