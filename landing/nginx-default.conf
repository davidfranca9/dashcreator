server {
    root /usr/share/nginx/html;
    index index.html index.htm;

    # HTML sempre revalida no navegador (nunca mostra pagina "velha")
    location / {
        try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # arquivos internos do projeto que moram dentro da pasta do site
    # (README, scripts, configuracao) nao sao servidos
    location ~* (\.(md|sh|py|conf|sql|log)$|/Dockerfile$) {
        return 404;
    }

    # midias e estaticos: cache curto de 1 hora
    location ~* \.(png|jpg|jpeg|webp|gif|svg|ico|mp4|webm|css|js|woff|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Handle 404 errors
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Handle server errors (50x)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
