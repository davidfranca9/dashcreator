<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento aprovado · The Creators Club</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --navy:#0A2463; --cream:#EAE4D4; --paper:#F5F1E8; --terra:#C9956A; --dark:#1A1410; --border:rgba(10,36,99,0.12); }
body { font-family:'DM Sans',sans-serif; background:var(--paper); color:var(--navy); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1rem; -webkit-font-smoothing:antialiased; }
.card { max-width:620px; width:100%; background:#fff; border:0.5px solid var(--border); border-radius:12px; padding:3rem 2.5rem; text-align:center; box-shadow:0 22px 70px rgba(10,36,99,0.08); }
.mark { width:68px; height:68px; border-radius:50%; background:var(--terra); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:2rem; margin-bottom:1.5rem; }
.label { display:block; font-size:0.68rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--terra); margin-bottom:0.8rem; }
h1 { font-family:'Cormorant Garamond',serif; font-size:2.5rem; font-weight:500; line-height:1.05; margin-bottom:0.9rem; }
h1 em { color:var(--terra); font-style:italic; }
p { color:rgba(10,36,99,0.62); font-size:0.98rem; line-height:1.7; margin:0 auto 1.2rem; max-width:470px; }
.note { color:rgba(10,36,99,0.45); font-size:0.82rem; }
.actions { display:flex; justify-content:center; margin-top:1.6rem; }
.btn { display:inline-flex; align-items:center; justify-content:center; background:var(--navy); color:var(--cream); min-height:48px; padding:0.85rem 1.5rem; border-radius:6px; text-decoration:none; font-size:0.78rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; }
.pending .mark { background:rgba(10,36,99,0.12); color:var(--navy); }
.pending .btn { background:rgba(10,36,99,0.08); color:var(--navy); pointer-events:none; }
</style>
</head>
<body>
<main class="card pending" id="successCard">
    <div class="mark" id="successMark">✓</div>
    <span class="label" id="successLabel">Confirmando pagamento</span>
    <h1 id="successTitle">Estamos validando<br><em>seu pagamento</em></h1>
    <p id="successText">Assim que o Mercado Pago confirmar, vamos te levar automaticamente para criar sua conta no Dash Creator.</p>
    <p class="note" id="successNote">Pode levar alguns segundos para PIX e cartão.</p>
    <div class="actions">
        <a class="btn" id="signupLink" href="https://app.thecreatorsclub.com.br/signup/">Ir para o cadastro</a>
    </div>
</main>
<script>
(() => {
    const API_BASE = "https://app.thecreatorsclub.com.br";
    const SIGNUP_URL = "https://app.thecreatorsclub.com.br/signup/";
    const params = new URLSearchParams(window.location.search);
    const purchaseId = params.get("p");
    const card = document.getElementById("successCard");
    const label = document.getElementById("successLabel");
    const title = document.getElementById("successTitle");
    const text = document.getElementById("successText");
    const note = document.getElementById("successNote");
    const link = document.getElementById("signupLink");
    let countdown = 5;
    let redirectTimer = null;
    let pollTimer = null;

    const startRedirect = () => {
        clearInterval(pollTimer);
        card.classList.remove("pending");
        label.textContent = "Pagamento aprovado";
        title.innerHTML = "Pagamento concluido<br><em>com sucesso</em>";
        text.textContent = "Seu acesso foi liberado. Tambem enviamos o codigo de acesso para o seu email.";
        link.href = SIGNUP_URL;
        link.style.pointerEvents = "auto";
        link.textContent = "Ir para o cadastro agora";
        note.textContent = `Vamos te redirecionar para o cadastro em ${countdown} segundos.`;
        redirectTimer = setInterval(() => {
            countdown -= 1;
            note.textContent = `Vamos te redirecionar para o cadastro em ${countdown} segundos.`;
            if (countdown <= 0) {
                clearInterval(redirectTimer);
                window.location.href = SIGNUP_URL;
            }
        }, 1000);
    };

    const checkStatus = async () => {
        if (!purchaseId) {
            startRedirect();
            return;
        }
        try {
            const response = await fetch(`${API_BASE}/checkout/api/status/?purchase_id=${encodeURIComponent(purchaseId)}`);
            const result = await response.json().catch(() => ({}));
            if (response.ok && result.status === "approved" && result.access_ready) {
                startRedirect();
            } else if (response.ok && ["rejected", "cancelled"].includes(result.status)) {
                clearInterval(pollTimer);
                label.textContent = "Pagamento nao aprovado";
                title.innerHTML = "Nao conseguimos confirmar<br><em>seu pagamento</em>";
                text.textContent = "Volte para o checkout e tente outro metodo de pagamento.";
                note.textContent = "";
                link.href = "/checkout/dashcreator/";
                link.style.pointerEvents = "auto";
                link.textContent = "Voltar para o checkout";
            }
        } catch (error) {
            console.error("Status check error", error);
        }
    };

    link.style.pointerEvents = "none";
    checkStatus();
    pollTimer = setInterval(checkStatus, 4000);
})();
</script>
</body>
</html>
