<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento não concluído · High Performance Creator</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/hpc/favicon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --background: #f5f1e8;
    --primary: #0a2463;
    --navy-deep: #1a1410;
    --muted: #5a5345;
    --shadow-soft: 0 20px 50px -24px rgba(10, 36, 99, .22);
}
body { font-family: "Inter", ui-sans-serif, system-ui, sans-serif; background: var(--background); color: var(--navy-deep); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; padding: 2.5rem 1rem; -webkit-font-smoothing: antialiased; }
.logo { width: min(56%, 12rem); height: auto; }
.card { max-width: 560px; width: 100%; background: #fff; border-radius: 10px; padding: 3rem 2.5rem; text-align: center; box-shadow: var(--shadow-soft); }
@media (max-width: 600px) { .card { padding: 2.25rem 1.4rem; border-radius: 10px; } }
.dot { width: 60px; height: 60px; border-radius: 50%; background: oklch(58% .2 25); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 1.4rem; }
h1 { font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-size: clamp(1.6rem, 4vw, 2rem); font-weight: 500; line-height: 1.15; margin-bottom: 0.8rem; }
p { color: var(--muted); font-size: 0.95rem; line-height: 1.7; margin-bottom: 1.4rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; background: var(--primary); color: #fff; min-height: 50px; padding: 0.9rem 1.8rem; text-decoration: none; font-size: 0.9rem; font-weight: 500; box-shadow: var(--shadow-soft); }
</style>
</head>
<body>
<a href="/hpc/" aria-label="Página da High Performance Creator"><img class="logo" src="/hpc/hpc-logo.png" alt="High Performance Creator" width="817" height="346"></a>
<main class="card">
    <div class="dot" aria-hidden="true">!</div>
    <h1>Não conseguimos concluir o pagamento</h1>
    <p>O Mercado Pago recusou ou cancelou a transação. Tente outro cartão ou outro método de pagamento.</p>
    <a class="btn" href="/checkout/hpc/">Tentar novamente</a>
</main>
</body>
</html>
