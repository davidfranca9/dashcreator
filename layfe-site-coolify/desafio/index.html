<title>Desafio da Semana · The Creators Club</title>

<style>
  :root{ --navy:#12245e; --navy2:#0d1a45; --accent:#8ea6ff; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--navy2); color:#fff; -webkit-text-size-adjust:100%;
  }
  .bar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 16px; background:rgba(13,26,69,.92);
    backdrop-filter:blur(8px); border-bottom:1px solid rgba(142,166,255,.18);
  }
  .bar h1{font-size:15px; margin:0; font-weight:700; letter-spacing:.2px}
  .bar .sub{font-size:12px; opacity:.7; font-weight:400; display:block; margin-top:2px}
  .btn{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:7px;
    background:var(--accent); color:#0d1a45; text-decoration:none;
    font-weight:700; font-size:13px; padding:9px 14px; border-radius:999px;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px)}
  .doc{max-width:1000px; margin:0 auto; padding:16px 12px 48px}
  .doc img{
    display:block; width:100%; height:auto; margin:0 auto 14px;
    border-radius:10px; box-shadow:0 6px 24px rgba(0,0,0,.35);
    background:#fff;
  }
  .foot{text-align:center; padding:8px 16px 40px; opacity:.65; font-size:12px}
  .foot a{color:var(--accent)}
</style>
</head>
<body>
